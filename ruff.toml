# Ruff configuration — mirrors Home Assistant's PEP 8 + PEP 257 enforcement.
# Home Assistant applies strict pycodestyle (PEP 8) and pydocstyle (PEP 257)
# checks to all submitted code; the suite follows the same ruleset.
# https://developers.home-assistant.io/docs/development_guidelines
line-length = 88
target-version = "py312"

[lint]
# pydocstyle (D) + pycodestyle errors/warnings (E/W) + pyflakes (F) + isort (I).
select = ["D", "E", "F", "W", "I"]
# Home Assistant's docstring ignores: D203/D213 conflict with D211/D212
# (HA style: no blank line before a class docstring, and the summary on the
# first physical line); D107 (missing __init__ docstring) is not required.
ignore = ["D107", "D203", "D213"]

[lint.isort]
# The integration package is first-party, so its imports group on their own.
known-first-party = ["custom_components"]
